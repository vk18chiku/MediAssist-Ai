# docker-compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediassist_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - CHROMA_DB_PATH=./vector_db/chroma_store
    networks:
      - mediassist_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mediassist_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=http://mediassist_backend:8000
    networks:
      - mediassist_net

networks:
  mediassist_net:
    driver: bridge